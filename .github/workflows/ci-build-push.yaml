name: ci-build-push
on:
  workflow_run:
    workflows: ["ci-test"]
    types:
      - completed
jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Gitlab Container Registry
        run: |
          echo "${{ secrets.GITLAB_REGISTRY_PAT }}" \
          | docker login registry.gitlab.com -u rickyslash --password-stdin
    