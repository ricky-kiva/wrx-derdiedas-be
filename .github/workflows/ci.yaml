name: ci
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x']
    services:
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --username $MONGO_INITDB_ROOT_USERNAME --password $MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 3
    env:
      MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USER }}
      MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
      MONGO_USER: ${{ secrets.MONGO_USER }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
      MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
      MONGO_HOST: ${{ secrets.MONGO_HOST }}
      MONGO_PORT: ${{ secrets.MONGO_PORT }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Initialize MongoDB
        run: node scripts/cicd/mongo/init.js
        env:
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
      - name: Start Redis service
        run: |
          docker run -d --name redis -p 6379:6379 \
          -e REDIS_PASSWORD=${REDIS_PASSWORD} \
          redis:7.4.5-alpine3.21 redis-server --requirepass "${REDIS_PASSWORD}"
      - name: Test
        run: npm run test
        env:
          CI: true
          NODE_ENV: test
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          PORT: ${{ secrets.PORT }}
          JWT_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
          JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRY: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRY }}
          JWT_REFRESH_TOKEN_EXPIRY: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRY }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_DATABASE: ${{ secrets.REDIS_DATABASE }}
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Gitlab Container Registry
        run: |
          echo "${{ secrets.GITLAB_REGISTRY_PAT }}" \
          | docker login registry.gitlab.com -u "${{ vars.GITLAB_USERNAME }}" --password-stdin
      - name: Build and push Docker image
        env:
          IMAGE: "registry.gitlab.com/${{ vars.GITLAB_GROUP }}/${{ vars.GITLAB_PROJECT }}"
        run: |
          SHA_TAG="${GITHUB_SHA::8}"

          docker build -t "$IMAGE:$SHA_TAG" .
          docker push "$IMAGE:$SHA_TAG"
  cleanup-registry:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Clean up GitLab Container Registry
        env:
          GITLAB_REGISTRY_PAT: ${{ secrets.GITLAB_REGISTRY_PAT }}
          GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
        run: |
          API="https://gitlab.com/api/v4/projects/${GITLAB_PROJECT_ID}/registry/repositories"

          REPO_ID=$(curl -s --header "PRIVATE-TOKEN: $GITLAB_REGISTRY_PAT" "$API" | jq -r '.[0].id')

          TAGS=$(curl -s --header "PRIVATE-TOKEN: $GITLAB_REGISTRY_PAT" "$API/$REPO_ID/tags")

          echo "$TAGS" | jq -r '.[].name' > all_tags.txt

          grep -E '^v?[0-9]+\.[0-9]+' all_tags.txt > version_tags.txt || true
          grep -E '^[0-9a-f]{8}$' all_tags.txt > sha_tags.txt || true

          jq -r '.[] | select(.name|test("^[0-9a-f]{8}$")) | "\(.created_at) \(.name)"' <<< "$TAGS" \
            | sort -r \
            | awk '{print $2}' \
            | tail -n +4 > old_sha_tags.txt

          echo "SHA tags to delete:"
          cat old_sha_tags.txt

          while read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Deleting tag: $TAG"
            curl -s --request DELETE \
              --header "PRIVATE-TOKEN: $GITLAB_REGISTRY_PAT" \
              "$API/$REPO_ID/tags/$TAG"
          done < old_sha_tags.txt
